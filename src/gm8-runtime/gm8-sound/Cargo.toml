[package]
name = "gm8-sound"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Bounded no_std parser for compressed GameMaker 8.0 Sound records"

[dependencies]
gm8-binary = { path = "../gm8-binary" }
gm8-zlib = { path = "../gm8-zlib" }
gm8-format-probe = { path = "../gm8-format-probe" }

[dev-dependencies]
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }

